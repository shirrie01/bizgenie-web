<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>BizGenie Studio — Isolated Concept Preview</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#182923;background:#f5f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d08b46;outline-offset:3px}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#162720;color:#f4f2e8;padding:29px 23px}.logo{font-size:25px;font-weight:750;letter-spacing:-1.3px}.logo i{color:#c6a27b;font-style:normal}.nav{margin-top:54px;color:#b9c8c0;line-height:3}.nav strong{color:white}.micro{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#9db5a7}.main{padding:28px 5vw 65px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;padding:9px 12px;border:1px solid #d6dcd5;border-radius:99px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#617d6c;margin-top:60px}h1{font-family:Georgia,serif;font-size:clamp(39px,5.5vw,76px);letter-spacing:-2px;line-height:1.07;max-width:900px;margin:16px 0 18px;font-weight:400}h2{font-size:24px;letter-spacing:-.6px}p{line-height:1.65;color:#64746b}.lead{font-size:18px;max-width:650px}.panel{background:white;border:1px solid #e0e5de;border-radius:22px;padding:26px;margin-top:27px;box-shadow:0 8px 32px #1d37210a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{border:1px solid #e0e5de;border-radius:17px;padding:20px;text-align:left;background:#fff;min-height:135px}.tile:hover,.tile[aria-pressed=true]{border-color:#245843;background:#f1f8f2}.tile b{display:block;margin:12px 0 5px}.tile small{color:#738277}.art{height:135px;border-radius:14px;display:flex;align-items:end;padding:18px;color:white;font-weight:700;background:linear-gradient(140deg,#d48c58,#773d37)}.art.two{background:linear-gradient(140deg,#354e62,#1a262c)}.art.three{background:linear-gradient(140deg,#8e9b76,#354d37)}.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.primary{background:#204c3a;color:white;border:0;border-radius:12px;padding:14px 23px}.secondary{background:white;color:#204c3a;border:1px solid #cbd7cd;border-radius:12px;padding:14px 23px}.step{color:#56715f;font-size:13px}.field{display:grid;gap:8px;margin:18px 0}.field input,.field textarea{padding:14px;border-radius:10px;border:1px solid #cbd7cd;max-width:570px;width:100%}.notice{font-size:12px;color:#61756a;background:#edf4ee;border-radius:9px;padding:12px 14px;margin-top:18px}.hidden{display:none}.progress{height:5px;background:#dce6dd;border-radius:20px;margin-top:22px;overflow:hidden}.progress div{height:100%;background:#2a6b4d;transition:width .2s}.summary{padding:20px;background:#f3f6f1;border-radius:12px;white-space:pre-wrap}.footer{margin-top:30px;color:#7a897f;font-size:12px}@media(max-width:850px){.shell{display:block}.side{padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.nav{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.eyebrow{margin-top:30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">bizgenie<i>✳</i></div><div class="nav"><div class="micro">Your workspace</div><strong>✦ Studio</strong><div>◫ Campaigns</div><div>▦ Calendar</div><div>◉ Brand Brain</div><div>◷ Insights</div></div><div class="micro">Concept preview</div></aside><main class="main"><div class="top"><span class="micro">The marketing operating system</span><span class="pill">DEMO · No live account</span></div><div class="progress"><div id="bar"></div></div><div id="content" aria-live="polite"></div><div class="footer">BizGenie Studio concept • Illustrative content only • No data transmitted or saved</div></main></div>
<script>
'use strict';
const state={step:0,name:'',website:'',goal:'',voice:'Confident, clear and human',channels:[]};const root=document.getElementById('content');const steps=['Welcome','Business','Goal','Brand','Channels','Proposal'];const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function buttons(next='Continue'){return '<div class="actions">'+(state.step?'<button class="secondary" id="back">← Back</button>':'')+'<button class="primary" id="next">'+next+' →</button></div>'}function render(){document.getElementById('bar').style.width=((state.step+1)/6*100)+'%';let h='<div class="eyebrow">Studio / '+steps[state.step]+' · Step '+(state.step+1)+' of 6</div>';if(state.step===0)h+='<h1>Great marketing starts with a great idea.</h1><p class="lead">Meet your new creative workspace. Discover what your business can say, make and achieve—all in one considered experience.</p><div class="panel"><h2>Ideas that travel across industries.</h2><div class="grid"><div><div class="art">Food & drink</div><p>Launch a product with confidence.</p></div><div><div class="art two">Automotive</div><p>Turn the next offer into enquiries.</p></div><div><div class="art three">Wellness</div><p>Bring more people through the door.</p></div></div><div class="notice">Illustrative demo categories. No actual customer campaigns or performance claims.</div></div>'+buttons('Start creating');if(state.step===1)h+='<h1>Tell us about your business.</h1><p class="lead">Start with the essentials. You can refine everything later.</p><div class="panel"><label class="field">Business name<input id="name" autocomplete="organization" maxlength="100" value="'+escapeHTML(state.name)+'" placeholder="e.g. Northside Studio"></label><label class="field">Website (optional)<input id="website" type="url" maxlength="200" value="'+escapeHTML(state.website)+'" placeholder="https://example.com"></label><div class="notice">Website extraction is not connected in this demo. Nothing will be imported automatically.</div>'+buttons()+'</div>';if(state.step===2)h+='<h1>What would success look like?</h1><p class="lead">Choose one goal to shape your first campaign.</p><div class="panel"><div class="grid">'+[['More customers','Turn attention into enquiries'],['More sales','Give an offer momentum'],['Brand awareness','Make your name memorable'],['Product launch','Introduce something new'],['Promotion','Create urgency with clarity'],['Community','Build stronger relationships']].map(([v,d])=>'<button class="tile" data-goal="'+v+'" aria-pressed="'+(state.goal===v)+'"><b>'+v+'</b><small>'+d+'</small></button>').join('')+'</div>'+buttons()+'</div>';if(state.step===3)h+='<h1>Make it unmistakably yours.</h1><p class="lead">Review the voice of '+escapeHTML(state.name||'your business')+'. Real brand facts must be verified before use.</p><div class="panel"><label class="field">Preferred brand voice<textarea id="voice" rows="4" maxlength="400">'+escapeHTML(state.voice)+'</textarea></label><div class="notice">Demo-only brand draft. No logo, claims, business details or brand facts have been imported or verified.</div>'+buttons()+'</div>';if(state.step===4)h+='<h1>Choose where to show up.</h1><p class="lead">Select channels to consider. No accounts are connected and nothing will publish.</p><div class="panel"><div class="grid">'+['Instagram','TikTok','Facebook','LinkedIn','Email','Website'].map(v=>'<button class="tile" data-channel="'+v+'" aria-pressed="'+state.channels.includes(v)+'"><b>'+v+'</b><small>'+ (state.channels.includes(v)?'Selected for proposal':'Not connected')+'</small></button>').join('')+'</div>'+buttons('Review proposal')+'</div>';if(state.step===5)h+='<h1>Your first campaign starts here.</h1><p class="lead">A strategy direction, ready for your review—not a generated or published campaign.</p><div class="panel"><h2>'+escapeHTML(state.name||'Your business')+' · Campaign direction</h2><div class="summary"><strong>Objective:</strong> '+escapeHTML(state.goal||'To be confirmed')+'\n<strong>Brand voice:</strong> '+escapeHTML(state.voice)+'\n<strong>Channels considered:</strong> '+escapeHTML(state.channels.join(', ')||'None selected')+'\n<strong>Next stage:</strong> Verify Brand Brain, review creative brief and approve any generation cost separately.</div><div class="notice">No campaign has been generated, charged, saved, connected or published. This is an illustrative proposal.</div>'+buttons('Restart preview')+'</div>';root.innerHTML=h;root.querySelector('#back')?.addEventListener('click',()=>{state.step--;render()});root.querySelector('#next').addEventListener('click',()=>{if(state.step===1){state.name=root.querySelector('#name').value.trim();state.website=root.querySelector('#website').value.trim();if(!state.name){root.querySelector('#name').focus();root.querySelector('#name').setCustomValidity('Please enter a business name');root.querySelector('#name').reportValidity();return}if(state.website&&!/^https?:\/\//i.test(state.website)){root.querySelector('#website').focus();root.querySelector('#website').setCustomValidity('Enter a full URL beginning with https://');root.querySelector('#website').reportValidity();return}}if(state.step===2&&!state.goal){root.querySelector('[data-goal]').focus();return}if(state.step===3)state.voice=root.querySelector('#voice').value.trim();if(state.step===5){state.step=0}else state.step++;render()});root.querySelectorAll('[data-goal]').forEach(b=>b.addEventListener('click',()=>{state.goal=b.dataset.goal;render()}));root.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.channel;state.channels=state.channels.includes(v)?state.channels.filter(x=>x!==v):[...state.channels,v];render()}))}render();
</script></body></html>
