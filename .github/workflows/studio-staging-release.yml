# BG-LAUNCH-013: controlled staging release of the Studio to Cloudflare Pages project `bizgenie-studio-staging`.
# MANUAL ONLY (workflow_dispatch): no push, pull_request or schedule trigger. It deploys nothing unless `deploy` is true AND the
# `staging-studio` GitHub Environment (required reviewers, set up by the founder) approves. Cloudflare secrets live only in that environment.
# Job 1 needs no secrets: it pins the exact SHA, builds from the lockfile, validates settings and the bundle, and keeps the evidence.
name: Studio staging release (manual)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to build (must be the approved commit)'
        required: true
      deploy:
        description: 'Deploy after verification (still needs Environment approval). Default false = build and verify only'
        type: boolean
        default: false
      api_origin:
        description: 'API origin the Studio will call. Leave empty for the default staging API host. Any other value must already be listed in APPROVED_API_ORIGINS in this file (a reviewed change), e.g. the trusted bridge once Codex has verified its origin'
        required: false
        default: ''
      smoke_url:
        description: 'Hostname to smoke-test after deploy'
        required: false
        default: 'https://staging-app.getbizgenie.com'
permissions: { contents: read }
# bash with pipefail for every step: `cmd | tee log` must fail when cmd fails (run #7 reported a failed upload as a successful step).
defaults: { run: { shell: bash } }
concurrency: { group: studio-staging-release, cancel-in-progress: false }
env:
  STAGING_API_ORIGIN: https://staging-api.getbizgenie.com
  # Space-separated. Extended only by a reviewed commit after the trusted bridge's browser-facing origin is verified (qa/hosted/staging-settings.json: approved_api_origins).
  APPROVED_API_ORIGINS: https://staging-api.getbizgenie.com
  # The subset of the approved origins that is the trusted staging bridge (empty until Codex verifies one). A build for one of these sets VITE_API_ROUTE_LIMITS=bridge-v1, so features the
  # bridge does not carry (Stripe checkout entry, manual publication) say so instead of calling it. Must be a subset of APPROVED_API_ORIGINS (qa/hosted/staging-settings.json: bridge_api_origins).
  BRIDGE_API_ORIGINS: ''
  STAGING_SUPABASE_URL: https://zrczojyxebwjgpymbmgu.supabase.co
  STAGING_SUPABASE_REF: zrczojyxebwjgpymbmgu
  PAGES_PROJECT: bizgenie-studio-staging
  PAGES_PRODUCTION_BRANCH: main
jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs: { dist_sha256: '${{ steps.hash.outputs.dist_sha256 }}', api_origin: '${{ steps.api.outputs.origin }}' }
    steps:
      - name: Refuse a smoke-test host that is not the approved staging Studio
        env: { SMOKE_URL: '${{ inputs.smoke_url }}' }
        run: |
          echo "$SMOKE_URL" | grep -Eq '^https://(staging-app\.getbizgenie\.com|([a-z0-9-]+\.)?bizgenie-studio-staging\.pages\.dev)/?$' || { echo "smoke_url must be the approved staging Studio host or the project's pages.dev host"; exit 1; }
      - id: api
        name: Resolve the API origin (the default staging host, or an origin approved in this workflow)
        env: { REQUESTED: '${{ inputs.api_origin }}' }
        run: |
          ORIGIN="${REQUESTED:-$STAGING_API_ORIGIN}"
          echo "$ORIGIN" | grep -Eq '^https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?$' || { echo "::error::api_origin must be a bare https origin (no path, port, query or credentials)"; exit 1; }
          case " $APPROVED_API_ORIGINS " in *" $ORIGIN "*) ;; *) echo "::error::$ORIGIN is not in APPROVED_API_ORIGINS. Add it in a reviewed change once its owner has verified it."; exit 1;; esac
          case " $BRIDGE_API_ORIGINS " in *" $ORIGIN "*) echo "limits=bridge-v1" >> "$GITHUB_OUTPUT";; *) echo "limits=" >> "$GITHUB_OUTPUT";; esac
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"; echo "API origin for this build: \`$ORIGIN\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Refuse anything but a full SHA
        env: { SHA: '${{ inputs.sha }}' }
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "sha must be 40 lowercase hex characters"; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.sha }}' }
      - name: Checked-out commit must equal the requested SHA
        env: { SHA: '${{ inputs.sha }}' }
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "requested: $SHA / checked out: $HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$HEAD_SHA" = "$SHA" ]
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test
      - name: Build for staging (fails closed on missing or mismatched settings)
        env:
          VITE_BIZGENIE_API_URL: ${{ steps.api.outputs.origin }}
          VITE_API_ROUTE_LIMITS: ${{ steps.api.outputs.limits }}
          VITE_SUPABASE_URL: ${{ env.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PREMIUM_STUDIO_ENABLED: 'true'
          VITE_GENERATION_QUOTE_API: 'true'
          VITE_WORKSPACE_CALENDAR_API: 'true'
          VITE_CUSTOMER_MEDIA_API: 'true'
          VITE_SOCIAL_ACCOUNTS_API: 'true'
          VITE_SOCIAL_PROVIDERS: tiktok
          VITE_SUPPORT_URL: ${{ vars.STAGING_SUPPORT_URL }}
          VITE_TERMS_URL: ${{ vars.STAGING_TERMS_URL }}
          VITE_PRIVACY_URL: ${{ vars.STAGING_PRIVACY_URL }}
          PAGES_EXPECT_API_ORIGIN: ${{ steps.api.outputs.origin }}
          PAGES_EXPECT_SUPABASE_REF: ${{ env.STAGING_SUPABASE_REF }}
          PAGES_NOINDEX: '1'
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "repository variable STAGING_SUPABASE_PUBLISHABLE_KEY (the publishable key, never a secret key) is not set"; exit 1; }
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_secret_*|eyJ*) echo "that is not a publishable key"; exit 1;; esac
          npm run build:pages
      - name: Verify headers, CSP, noindex and that no secret or other-environment value is in the bundle
        run: node scripts/smoke-pages.mjs --dir dist --api "${{ steps.api.outputs.origin }}" --supabase-ref "$STAGING_SUPABASE_REF" --noindex
      - id: hash
        name: Fingerprint the exact files that would be deployed
        run: |
          H="$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "dist_sha256=$H" >> "$GITHUB_OUTPUT"
          { echo "### Studio staging build"; echo "- commit: \`${{ inputs.sha }}\`"; echo "- dist sha256: \`$H\`"; echo "- node: $(node -v)"; echo "- deploy requested: ${{ inputs.deploy }}"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: 'studio-staging-dist-${{ inputs.sha }}', path: dist, retention-days: 30 }
  deploy:
    needs: build-verify
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-studio
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: 'studio-staging-dist-${{ inputs.sha }}', path: dist }
      - name: Artefact must be the one that was verified
        env: { EXPECTED: '${{ needs.build-verify.outputs.dist_sha256 }}' }
        run: |
          H="$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          [ "$H" = "$EXPECTED" ] || { echo "dist differs from the verified build"; exit 1; }
      - name: Fetch the release tooling from the workflow's own ref (the checked-out SHA is the app build and may predate these helpers)
        uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', path: tooling }
      - name: Record the deployment being replaced (rollback target; read-only)
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          # Secrets are stored as typed: strip any whitespace/line break and a pasted "Bearer " prefix (neither can be part of a token or account id). Values stay masked.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed -E 's/^[Bb]earer//')"; CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"; export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          node tooling/scripts/staging/cloudflare-previous-deployment.mjs | tee previous.txt
          cat previous.txt >> "$GITHUB_ENV"
          echo "- rollback target (previous deployment id): \`$(grep '^PREVIOUS_DEPLOYMENT_ID=' previous.txt | cut -d= -f2)\` (\`none\` = first deployment, nothing to roll back to)" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the verified files
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          # Secrets are stored as typed: strip any whitespace/line break and a pasted "Bearer " prefix (neither can be part of a token or account id). Values stay masked.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed -E 's/^[Bb]earer//')"; CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"; export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@3 pages deploy dist --project-name "$PAGES_PROJECT" --branch "${PROJECT_PRODUCTION_BRANCH:-$PAGES_PRODUCTION_BRANCH}" --commit-hash "${{ inputs.sha }}" --commit-dirty=false 2>&1 | tee deploy.log
      - name: Verify Cloudflare lists this deployment (read-only; a zero exit code from the upload is not proof)
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
        run: |
          # Secrets are stored as typed: strip any whitespace/line break and a pasted "Bearer " prefix (neither can be part of a token or account id). Values stay masked.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed -E 's/^[Bb]earer//')"; CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"; export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          node tooling/scripts/staging/cloudflare-previous-deployment.mjs --verify "${{ inputs.sha }}" | tee deployment.txt
          cat deployment.txt >> "$GITHUB_ENV"
          { echo "### Cloudflare deployment"; sed 's/^/- /' deployment.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the live host
        run: node scripts/smoke-pages.mjs --url "${{ inputs.smoke_url }}" --api "${{ needs.build-verify.outputs.api_origin }}" --supabase-ref "$STAGING_SUPABASE_REF" --noindex
      - if: ${{ failure() }}
        name: Say how to roll back
        run: |
          echo "Deploy or smoke test failed. Previous deployment: ${PREVIOUS_DEPLOYMENT_ID:-not recorded (the run failed before the deploy step)}. To roll back, use the Cloudflare dashboard > Workers & Pages > $PAGES_PROJECT > Deployments > that deployment > Rollback. Nothing else was changed." | tee -a "$GITHUB_STEP_SUMMARY"
